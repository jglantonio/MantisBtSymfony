name: Symfony

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest

    # MySQL efímero para los tests. Cargamos el esquema legacy de MantisBT
    # (.github/schema/mantis_schema.sql) sobre la base de datos bugtracker_test,
    # que es la que Doctrine usa en el entorno test (dbname_suffix: _test).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bugtracker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_mysql, mbstring, intl
        coverage: none

    - name: Copy .env.test.local
      run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Wait for MySQL
      run: |
        for i in $(seq 1 30); do
          if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
            echo "MySQL listo"; break
          fi
          echo "Esperando a MySQL..."; sleep 2
        done

    - name: Load MantisBT schema into bugtracker_test
      run: mysql -h 127.0.0.1 -uroot -proot bugtracker_test < .github/schema/mantis_schema.sql

    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        # dbname_suffix (_test) en config/packages/doctrine.yaml deja la BD en bugtracker_test.
        DATABASE_URL: "mysql://root:root@127.0.0.1:3306/bugtracker?serverVersion=8.0.32&charset=utf8mb4"
      run: vendor/bin/phpunit
